name: genfly
description: Production-grade flight booking platform for 100,000+ users.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.5
  cloud_firestore: ^5.6.6

  # Environment
  flutter_dotenv: ^5.2.1

  # Payment — added back when payment module is built
  # razorpay_flutter: ^1.3.7

  # PDF & Documents
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5

  # Utils
  intl: ^0.20.2
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env
